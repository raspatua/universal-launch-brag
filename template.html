<!DOCTYPE html>
<html>
<head>
  <script src="https://tailwindcss.com"></script>
  <style>
    body { background-color: #020617; color: white; font-family: system-ui, sans-serif; overflow: hidden; }
    .scanlines {
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%), 
                  linear-gradient(90deg, rgba(255, 255, 255, 0.02), rgba(0, 0, 0, 0.2));
      background-size: 100% 4px, 6px 100%;
    }
  </style>
</head>
<body class="w-[1080px] h-[1920px] flex justify-center items-center text-center p-16 relative scanlines select-none">
  
  <div id="grid-backdrop" class="absolute inset-0 opacity-15" style="background-image: linear-gradient(to right, #334155 1px, transparent 1px), linear-gradient(to bottom, #334155 1px, transparent 1px); background-size: 60px 60px;"></div>
  <div id="glow-mesh-1" class="absolute w-[900px] h-[900px] rounded-full filter blur-[150px] top-[15%] left-[-10%] opacity-20"></div>
  <div id="glow-mesh-2" class="absolute w-[700px] h-[700px] rounded-full filter blur-[130px] bottom-[10%] right-[-10%] opacity-10"></div>
  
  <div id="scene-hook" class="absolute opacity-0 flex flex-col items-center">
    <h1 id="logo" class="text-9xl font-black bg-clip-text text-transparent tracking-tighter leading-none py-4"></h1>
    <p id="tagline" class="text-slate-400 text-4xl mt-8 font-light tracking-wide"></p>
  </div>

  <div id="scene-problem" class="absolute opacity-0 flex flex-col gap-12 max-w-4xl px-8 text-left"></div>

  <div id="scene-showcase" class="absolute opacity-0 w-full max-w-3xl flex flex-col items-center">
    <h2 id="showcase-title" class="text-3xl text-slate-500 font-bold uppercase tracking-[0.3em] mb-20">Platform Architecture</h2>
    <div id="feature-container" class="flex flex-col gap-8 w-full"></div>
  </div>

  <div id="scene-cta" class="absolute opacity-0 flex flex-col items-center">
    <h2 id="cta-head" class="text-6xl font-black text-white mb-16 tracking-tight leading-tight"></h2>
    <div id="cta-pill" class="px-20 py-10 rounded-full flex items-center justify-center border border-white/10">
      <span id="cta-url" class="text-4xl font-mono font-black tracking-widest text-white"></span>
    </div>
  </div>

  <script>
    // Pure, simple frame-by-frame interpolation values without relying on heavy timeline objects
    let videoData = null;

    window.loadProjectData = (data) => {
      videoData = data;
      const primaryGrad = data.colors?.primary || "linear-gradient(90deg, #3b82f6, #8b5cf6)";
      const bgHex = data.colors?.bg || "#020617";
      
      document.body.style.backgroundColor = bgHex;
      
      const logoEl = document.getElementById('logo');
      logoEl.style.backgroundImage = primaryGrad;
      logoEl.innerText = data.name;
      
      document.getElementById('tagline').innerText = data.tagline;
      document.getElementById('cta-head').innerText = data.tagline;
      document.getElementById('cta-url').innerText = data.url;
      document.getElementById('cta-pill').style.background = primaryGrad;
      
      document.getElementById('glow-mesh-1').style.background = primaryGrad;
      document.getElementById('glow-mesh-2').style.background = primaryGrad;

      const problemBox = document.getElementById('scene-problem');
      problemBox.innerHTML = data.problemLines.map(line => 
        `<h2 class="problem-line text-6xl font-extrabold text-slate-100 leading-snug transform transition-all duration-300">${line}</h2>`
      ).join('');

      const featBox = document.getElementById('feature-container');
      featBox.innerHTML = data.features.map(f => `
        <div class="feature-card bg-slate-900/80 border border-slate-800 rounded-[40px] p-12 text-left flex justify-between items-center shadow-2xl transition-all duration-300">
          <div>
            <h3 class="text-4xl font-black text-white tracking-tight">${f.title}</h3>
            <p class="text-slate-400 text-2xl mt-4 leading-relaxed">${f.desc}</p>
          </div>
          <div class="h-10 w-10 rounded-full flex-shrink-0 ml-6 shadow-lg" style="background: ${primaryGrad}"></div>
        </div>
      `).join('');
    };

    window.seekToFrame = (frameIndex, fps) => {
      const time = frameIndex / fps;
      
      // Hide all scenes by default
      document.getElementById("scene-hook").style.opacity = 0;
      document.getElementById("scene-problem").style.opacity = 0;
      document.getElementById("scene-showcase").style.opacity = 0;
      document.getElementById("scene-cta").style.opacity = 0;

      // 0s - 3s: Hook Reveal
      if (time >= 0 && time < 3) {
        const hook = document.getElementById("scene-hook");
        hook.style.opacity = 1;
        const progress = time / 3;
        hook.style.transform = `scale(${0.8 + progress * 0.2})`;
      }
      // 3s - 7s: Problem Kinetic Typography
      else if (time >= 3 && time < 7) {
        document.getElementById("scene-problem").style.opacity = 1;
        const lines = document.querySelectorAll(".problem-line");
        lines.forEach((line, i) => {
          const triggerTime = 3.2 + (i * 0.9);
          line.style.opacity = time >= triggerTime ? 1 : 0;
          line.style.transform = time >= triggerTime ? "translateY(0px)" : "translateY(30px)";
        });
      }
      // 7s - 15s: Showcase Features
      else if (time >= 7 && time < 15) {
        document.getElementById("scene-showcase").style.opacity = 1;
        const cards = document.querySelectorAll(".feature-card");
        cards.forEach((card, i) => {
          const triggerTime = 7.4 + (i * 2.2);
          card.style.opacity = time >= triggerTime ? 1 : 0.2;
          card.style.transform = time >= triggerTime ? "scale(1)" : "scale(0.95)";
        });
      }
      // 15s - 20s: Call To Action
      else if (time >= 15) {
        document.getElementById("scene-cta").style.opacity = 1;
        const pill = document.getElementById("cta-pill");
        const pulse = 1 + Math.sin(time * 5) * 0.03;
        pill.style.transform = `scale(${pulse})`;
      }
    };
  </script>
</body>
</html>
